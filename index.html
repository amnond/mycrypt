<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="referrer" content="no-referrer">
        <!-- Keep script execution same-origin only. index.html and app.js
             contain no inline scripts or inline event handlers. -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">

        <title>MyCrypt</title>
        <link rel="icon" type="image/svg+xml" href="lock.svg">

        <link rel="preload" as="image" href="hmenu.svg">
        <link rel="preload" as="image" href="eye.svg">
        <link rel="preload" as="image" href="eye_off.svg">
        <link rel="preload" as="image" href="loader.svg">
        <link rel="preload" as="image" href="copy.svg">
        <style>
        *, *::before, *::after { box-sizing:border-box; }
        html { height:100%; }
        body, button, input {
            font-family:Arial;
            font-size:14px;
        }
        body { height:100%; margin:0; padding:0; }
        table {
            border-collapse: collapse;
        }
        table, td, th {
            border: 1px solid black;
        }

        .no-border {
            border:none !important;
        }

        td {
            padding: 5px;
        }

        #id_search_results table {
            width:100%;
        }

        #id_search_results td {
            padding: 2px;
        }

        textarea {
            resize:none;
            word-break:break-all;
        }

        .field_name {
            vertical-align:top;
            width:1%;
        }

        .row-handle {
            width: 100%;
            height: 5px;
            padding: 0px;
            background-color: #ccc;
            cursor: ns-resize; /* Vertical resize cursor */
            user-select:none;
        }

        .no-select {
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* Internet Explorer/Edge */
            user-select: none; /* Non-prefixed version, currently supported by Chrome, Opera and Firefox */
        }

        .record-header {
            margin-top: 5px;
            font-size:18px;
            padding-left: 5px;
            padding-right: 5px;
            padding-bottom: 3px;
        }

        /*
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 30%;
        }
        */

        .ctxMenu {
            display: none;
            position: absolute;
            z-index: 1000;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            background-color: #fff;
            min-width: 120px;
            overflow: auto;
            border: 1px solid #ccc;    
            border-radius: 12px;
            padding: 2px 6px;
        }
        
        .ctxMenu button {
            color: black;
            padding: 2px 6px;
            text-decoration: none;
            display: block;
            font-size: 1em;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }
        
        .ctxMenu button:hover {
            background-color: #ddd;
        }

        .root-menu {
            border-radius: 5px;
        }
        
        .folder-option {
            width: 200px;
        }

        @media (max-width: 600px) {
            body, button, input {
                font-size: 16px;
            }
            .record-header {
                font-size: 16px;
            }
            #id_content {
                min-width: unset;
            }
            .ctxMenu {
                min-width: 100px;
            }
        }

        #id_top_panel {
            background: #eee;
            overflow: auto;
            flex-shrink: 0;
        }
        #id_splitter {
            background: #444;
            height: 5px;
            cursor: ns-resize;
            flex-shrink: 0;
            touch-action: none;
        }
        #id_bottom_panel {
            background: #eee;
            overflow: auto;
            flex-grow: 1;
            flex-shrink: 1;
            min-height: 120px;
        }

        #id_content {
            height:100%;
            min-width:300px;
            display:flex;
            flex-direction:column;
        }

        </style>
        <script type="text/javascript" src="libpwsafejs/jDataView/src/jdataview.js"></script>
        <script type="text/javascript" src="libpwsafejs/crypto-sha256-hmac.js"></script>
        <script type="text/javascript" src="libpwsafejs/twofish.js"></script>
        <script type="text/javascript" src="libpwsafejs/pwsafedb.js"></script>

        <link rel="stylesheet" href="treeview.css" />
        <script type="text/javascript" src="treeview.js"></script>
        
        <script type="text/javascript" src="app.js"></script>
    </head>
    <body>
        <!--
        <div id="id_modal" class="modal">
            <div class="modal-content" style='width:calc(100% - 95px);' id="id_modal_content">
            </div>
        </div>
        -->
        <div id='id_content' style="height:100%; min-width:300px;">
            <p style="font-family:Arial; font-size:14px; padding:10px;">
                Loading MyCrypt&hellip;
            </p>
            <p style="font-family:Arial; font-size:12px; padding:0 10px; color:#555;">
                If this message does not disappear, <code>app.js</code> failed to load or JavaScript is
                disabled. Check the browser developer console and make sure every file from the
                deployment was uploaded.
            </p>
            <noscript>
                <p style="font-family:Arial; font-size:14px; padding:10px;">
                    MyCrypt requires JavaScript.
                </p>
            </noscript>
        </div>
    </body>
</html>
